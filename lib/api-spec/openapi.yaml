openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: team
    description: Public Cutline team profiles
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /team:
    get:
      operationId: getTeamProfiles
      tags: [team]
      summary: Get Cutline team profiles
      description: Returns the static team roster and public Discord profile details when available.
      responses:
        "200":
          description: Team roster, including safe fallbacks when Discord profiles cannot be fetched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamProfilesResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TeamMember:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        role:
          type: string
        username:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        profileAvailable:
          type: boolean
      required:
        - slug
        - name
        - role
        - username
        - avatarUrl
        - profileAvailable
    TeamProfilesResponse:
      type: object
      properties:
        status:
          type: string
          enum: [live, partial, offline]
          description: Discord profile availability; the team names and roles are always included.
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
      required:
        - status
        - members

